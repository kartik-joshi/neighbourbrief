{% extends "base.html" %}
{% block title %}{{ title }} · NeighbourBrief TO{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl py-10 text-center">
  <h1 class="text-2xl sm:text-3xl font-bold text-ink">{{ title }}</h1>
  <p class="mt-3 text-slate-600">{{ message }}</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2">
    {% if link %}<a class="btn-primary" href="{{ link[0] }}">{{ link[1] }}</a>{% endif %}
    {% if public %}
    <a class="{{ 'btn-secondary' if link else 'btn-primary' }}" href="/">Home</a>
    <a class="btn-secondary" href="/neighbourhoods">Neighbourhoods</a>
    {% else %}
    <a class="{{ 'btn-secondary' if link else 'btn-primary' }}" href="/history">Your saved bulletins</a>
    <a class="btn-secondary" href="/new">New bulletin</a>
    <a class="btn-secondary" href="/status">Status</a>
    {% endif %}
  </div>
</div>
{% endblock %}
